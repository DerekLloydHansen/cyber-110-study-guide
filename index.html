     exp:'Social media is about <strong>many-to-many</strong> creation and sharing of content, which is also why false information can spread so fast.'},
    {id:'i7', type:'mc',
     q:'What is <strong>disinformation</strong>?',
     opts:[
       "False information that someone shares by mistake, believing it's true",
       "True information that has been taken out of context to mislead",
       "False information spread deliberately to influence opinion or hide the truth",
       "Information that was accurate once but is now out of date"],
     correct:2,
     exp:'The key word is <strong>deliberately</strong>. When states do this to other countries it is called <strong>FIMI</strong>: Foreign Information Manipulation and Interference.'},
    {id:'i8', type:'mc',
     q:'You quickly believe and share a headline because it matches what you already thought, without checking it. Which psychological factor is at work?',
     opts:[
       "Encapsulation",
       "Least privilege",
       "Confirmation bias",
       "Non-repudiation"],
     correct:2,
     exp:'<strong>Confirmation bias</strong> makes us accept information that fits our existing beliefs and scrutinize information that doesn\'t. It is one of the psychological factors that make disinformation effective.'},
    {id:'i9', type:'multi',
     q:'Which of these are good criteria for evaluating information? (Select all that apply)',
     opts:['Authority (who wrote or published it?)','Currency (how recently was it updated?)','Whether it agrees with what I already believe','Accuracy and evidence','How exciting the headline is','Peer review or another review process'],
     correct:[0,1,3,5],
     exp:'Good criteria include <strong>accuracy, authority, publisher, currency, coverage, bias, peer review</strong>, the URL\'s domain, and links to and from the source. Agreement with your own views and an exciting headline are traps, not criteria.'},
    {id:'i10', type:'mc',
     q:'A message says: "Provo College is offering an exclusive 50% tuition discount to a select few students! You\'re one of the lucky few! Click to claim before it expires: provocollege-offer.com. Hurry!" Which feature is the strongest red flag?',
     opts:[

     correct:3,
     exp:'Pressure ("Hurry!"), exclusivity ("lucky few"), and a <strong>lookalike domain</strong> are classic phishing signs. AI can now write polished messages, so judge the <em>request</em> and the <em>link</em>, not just the grammar.'},
    {id:'i11', type:'mc',
     q:'You copy two sentences from a blog into your lab report without quotation marks or a citation. What is this?',

       "Paraphrasing",
       "Peer review"],
     correct:1,
     exp:'Using someone else\'s words or ideas without credit is <strong>plagiarism</strong>. Quote and cite, or paraphrase and still cite. The same goes for AI-generated text (see the AI policy).'},
    {id:'i12', type:'short',
     q:'You find a website claiming a new vulnerability affects every iPhone. Describe <strong>three criteria</strong> you would use to decide whether to trust it, and what you would check for each.',
     keywords:['author','authority','publisher','date','current','recent','source','cite','evidence','bias','domain','peer','other','cisa','apple','verify'],
     modelAnswer:'(1) Authority: who wrote it and who published it? I would check whether it comes from a recognized security researcher, a reputable outlet, or an official source like Apple or CISA. (2) Currency: when was it published or updated? Vulnerability information changes quickly. (3) Accuracy and corroboration: does it cite evidence such as a CVE number or a vendor advisory, and do other trustworthy sources report the same thing? I would also watch for bias, such as a site trying to sell a "fix."',
     exp:'Strong answers name a criterion (<strong>authority, currency, accuracy, bias, coverage, peer review</strong>) <em>and</em> the concrete check you would do for it.'},
  ]
},

{
  id:'crypto', quiz:7, title:'Cryptography', color:'#b91c1c',
  desc:'Symmetric vs. asymmetric keys, signatures, hashing, HTTPS vs. E2EE, steganography',
  questions:[
    {id:'c1', src:'quiz', type:'mc', q:'Which of these is <strong>not</strong> one of the four security services cryptography deals with?',
     opts:[
       "Availability",
       "Integrity",
       "Confidentiality",
       "Non-repudiation"],
     correct:0,
     exp:'Cryptography provides <strong>confidentiality</strong> (encryption), <strong>integrity</strong> (hashes), <strong>authentication</strong>, and <strong>non-repudiation</strong> (digital signatures). It doesn\'t keep systems available; a DoS attack can take down a fully encrypted server.'},
    {id:'c2', src:'quiz', type:'tf', q:'In symmetric (secret-key) cryptography, the same key is used to encrypt and decrypt.',
     correct:0,
     exp:'<strong>True.</strong> Symmetric encryption (like AES) uses one shared secret key. The hard part is safely sharing that key with the other person in the first place.'},
    {id:'c3', src:'quiz', type:'mc', q:'Which is generally faster: symmetric or asymmetric encryption?',
     opts:['Symmetric','Asymmetric'], correct:0,
     exp:'<strong>Symmetric</strong> encryption is much faster. Real systems such as HTTPS use asymmetric cryptography to exchange a symmetric key, then use that symmetric key to encrypt the actual data.'},
    {id:'c4', src:'quiz', type:'mc', q:'You want to digitally sign a document so people know it came from you. Which key do you use?',
     opts:[
       "Your public key",
       "The recipient's private key",

       "Your private key"],
     correct:3,
     exp:'You sign with your <strong>private key</strong>, which only you have. Anyone can verify the signature with your <em>public</em> key. That is how signatures provide authentication and non-repudiation.'},
    {id:'c5', type:'mc', q:'You want to send Alice a message that <em>only Alice</em> can read, using asymmetric cryptography. Which key do you encrypt it with?',
     opts:[
       "Alice's public key",
       "Your public key",
       "Your private key",
       "Alice's private key"],
     correct:0,
     exp:'Encrypt with <strong>Alice\'s public key</strong>. Only her matching <em>private</em> key can decrypt it. A memory trick: <em>encrypt to</em> someone with their public key; <em>sign as</em> yourself with your private key.'},
    {id:'c6', src:'quiz', type:'tf', q:'If you have a hash digest, you can run it through a decryption algorithm to recover the original plaintext.',
     correct:1,
     exp:'<strong>False.</strong> Hashing is a <strong>one-way</strong> function, not encryption, so there is no key and no way to decrypt. Attackers can only guess inputs and compare hashes.'},
    {id:'c7', type:'multi', q:'Which of the following are true of cryptographic <strong>hash functions</strong>? (Select all that apply)',
     opts:['The same input always produces the same digest','The digest is a fixed length no matter how big the input is','Changing one character of the input produces a completely different digest','The original input can be recovered with the right key'],
     correct:[0,1,2],
     exp:'Hashes are <strong>deterministic</strong>, <strong>fixed-length</strong>, and highly sensitive to change (the "avalanche effect"). There is no key, and they can\'t be reversed.'},
    {id:'c8', type:'mc', q:'Why do well-designed websites store a <strong>hash</strong> of your password instead of the password itself?',
     opts:[
       "If the database is stolen, attackers don't get the actual passwords",
       "Hashes are encrypted, so the site can decrypt them if needed",
       "Hashes let the site email your password back if you forget it",
       "Hashing compresses passwords so they take up less storage space"],
     correct:0,
     exp:'At login, the site hashes what you type and compares it to the stored hash. If the database leaks, attackers only get hashes, not plaintext passwords. (This is also why a good site can only <em>reset</em> your password, not send it to you.)'},
    {id:'c9', src:'quiz', type:'mc', q:'What is the difference between cryptography and steganography?',
     opts:[
       "They are the same thing",
       "Cryptography uses keys and steganography never does",
       "Cryptography hides the meaning of a message, while steganography hides the fact that a message exists",
       "Steganography only works on images"],
     correct:2,
     exp:'<strong>Cryptography</strong> scrambles a message so it can\'t be <em>read</em>; <strong>steganography</strong> hides the message so no one knows it\'s <em>there</em> (for example, inside the pixels of an image or an audio file). They can be combined.'},
    {id:'c10', type:'matching', q:'Match each term to its description.',
     pairs:[
       {L:'Symmetric encryption', R:'One shared secret key both encrypts and decrypts'},
       {L:'Asymmetric encryption', R:'Uses a mathematically linked public/private key pair'},
       {L:'Hash function', R:'One-way function that produces a fixed-length digest'},
       {L:'Digital signature', R:'Made with a private key to prove who sent a message and that it wasn\'t changed'},
       {L:'Steganography', R:'Hides the existence of a message inside other data'},
     ],
     distractors:['Reverses a digest to recover the original text'],
     exp:'The extra choice describes something that isn\'t possible: hashes are one-way by design.'},
    {id:'c11', src:'quiz', type:'short', q:'Give one example of when you would use a <strong>hash function</strong>.',
     keywords:['password','integrity','download','verify','checksum','file','tamper','compare','signature','blockchain','sha'],
     modelAnswer:'Hashes are used to store passwords safely: the site saves only the hash and compares it to the hash of what you type at login. Another example is verifying a download: you compare the SHA-256 hash of the file you received to the one published by the developer, and if they match, the file wasn\'t corrupted or tampered with.',
     exp:'Common uses: <strong>password storage</strong>, <strong>file integrity checks</strong>, <strong>digital signatures</strong> (you sign the hash), and <strong>blockchains</strong>.'},
    {id:'c12', src:'quiz', type:'short', q:'How do you see yourself using cryptography in the future?',
     keywords:['https','encrypt','password','vpn','sign','hash','messag','secure','key','data','career','job'],
     modelAnswer:'Answers will vary. For example: I already use cryptography every day through HTTPS, encrypted messaging apps and my password manager. In my career I expect to configure TLS certificates on servers, make sure sensitive data is encrypted at rest and in transit, verify file hashes during incident response, and use SSH keys and code signing in development.',
     exp:'A strong answer connects a specific cryptographic tool (<strong>encryption, hashing, signatures, keys</strong>) to a concrete personal or professional situation.'},

    {id:'c13', type:'mc',
     q:'Why is the <strong>Caesar cipher</strong> not secure?',
     opts:[
       "It has only 26 possible keys and is open to frequency analysis",
       "Its method is secret, so it breaks once the method is known",
       "It relies on a public key that anyone can look up online",
       "Its ciphertext is always much longer than the original message"],
     correct:0,
     exp:'With only <strong>26 shifts</strong>, an attacker can try them all, and letter frequencies (E is the most common letter) give it away. The Vigenère cipher improves on this with a key <em>string</em>, but is still only secure with a long, random key.'},
    {id:'c14', type:'mc',
     q:'<strong>Kerckhoffs\'s principle</strong> says a cryptographic system should be secure even if:',
     opts:[
       "the key is shared publicly along with the algorithm",
       "the algorithm is kept secret from everyone except the users",
       "the attacker has already stolen the recipient's private key",
       "everything about the system is public knowledge except the key"],
     correct:3,
     exp:'Modern algorithms like AES and RSA are <strong>published</strong>. Their security depends only on keeping the <strong>key</strong> secret.'},
    {id:'c15', type:'mc',
     q:'Which of these is an example of an <strong>asymmetric</strong> (public-key) algorithm?',
     opts:[
       "AES",
       "Caesar cipher",
       "RSA",
       "SHA-256"],
     correct:2,
     exp:'<strong>RSA</strong>, Diffie–Hellman, and Elliptic Curve Cryptography are asymmetric. AES, Twofish, and the Caesar and Vigenère ciphers are symmetric. SHA-256, bcrypt, and MD5 are hash functions.'},
    {id:'c16', type:'mc',
     q:'What is the difference between HTTPS and <strong>end-to-end encryption (E2EE)</strong>?',
     opts:[
       "They are the same; HTTPS is just the web version of E2EE",
       "HTTPS encrypts user-to-server; E2EE encrypts device-to-device past the server",
       "E2EE protects data on servers; HTTPS protects data on phones",
       "HTTPS uses only symmetric keys; E2EE uses only asymmetric keys"],
     correct:1,
     exp:'With plain HTTPS, the <strong>server</strong> can read your data. With true E2EE (Signal, WhatsApp, iMessage), only the endpoints can, with no "back door" for the provider or law enforcement.'},
    {id:'c17', type:'mc',
     q:'Why do security experts worry about "<strong>store now, decrypt later</strong>"?',
     opts:[
       "Companies keep backups so long that the encryption keys get lost",
       "Attackers save encrypted data now, hoping future quantum computers can break it",
       "Hashes stored today will expire and can then be reversed later",
       "Malware hides encrypted files on a drive and unlocks them months later"],
     correct:1,
     exp:'State actors may collect encrypted traffic now and decrypt it once quantum computers can break today\'s public-key algorithms. That is why NIST-approved <strong>post-quantum</strong> (e.g., lattice-based) algorithms are being adopted.'},
    {id:'c18', type:'mc',
     q:'Public-key cryptography lets people communicate securely without sharing a secret key first, but it is still vulnerable to which attack during key distribution?',
     opts:[
       "Model extraction",
       "Rowhammer",
       "Typosquatting",
       "Adversary-in-the-middle"],
     correct:3,
     exp:'If an attacker can hand you <em>their</em> public key while pretending it belongs to someone else, they can read and relay your messages. <strong>Certificates</strong> (as used by HTTPS) help prove whose key is whose.'},

    {id:'c19', type:'mc',
     q:'What is the biggest practical challenge of <strong>symmetric</strong> encryption?',
     opts:["It can only be used to create digital signatures","It is far too slow to encrypt large files or web traffic","It needs a different key to encrypt than to decrypt","Securely getting the same secret key to both people before they communicate"],
     correct:3,
     exp:'With symmetric encryption both sides need the <strong>same secret key</strong>, so the hard part is <strong>key distribution</strong>. Asymmetric cryptography solves this, and HTTPS uses it to set up a symmetric key, which is then used because it is fast.'},
    {id:'c20', type:'mc',
     q:'You download a program from two different mirror sites. Both copies produce exactly the same SHA-256 digest. What can you conclude?',
     opts:['The two files are identical, barring an extremely rare collision','Both files were encrypted with the same secret key','Both files are safe, because hashing removes malware','Both files were downloaded from the same server'],
     correct:0,
     exp:'A hash digest works like a <strong>fingerprint</strong>: matching digests mean matching files. It doesn\'t prove a file is safe, only that it hasn\'t changed, so compare it with the hash the developer publishes.'},
    {id:'c21', type:'short',
     q:'A classmate says, "Symmetric and asymmetric encryption are basically the same thing." Explain <strong>two important differences</strong> to correct them.',
     keywords:['one key','same key','shared','pair','public','private','faster','slower','speed','distribut','signature'],
     modelAnswer:'(1) Keys: symmetric encryption uses one shared secret key for both encrypting and decrypting, while asymmetric uses a key pair, a public key anyone can have and a private key only the owner keeps. (2) Speed and key sharing: symmetric is much faster, but both people must somehow share the secret key safely first; asymmetric is slower, but strangers can communicate securely without sharing a secret in advance. (Asymmetric also makes digital signatures possible.)',
     exp:'Key differences: <strong>one key vs. a key pair</strong>, <strong>speed</strong>, <strong>key distribution</strong>, and <strong>signatures/non-repudiation</strong>. HTTPS combines both to get the best of each.'},
  ]
},

    {id:'a9', src:'quiz', type:'multi', q:'Which of the following are attacks on AI/ML models? (Select all that apply)',
     opts:['Poisoning','Evasion','Clustering','Model extraction'], correct:[0,1,3],
     exp:'Poisoning, evasion, and model extraction are all attacks. <strong>Clustering</strong> is a normal machine-learning technique for grouping similar data, not an attack.'},
    {id:'a10', src:'quiz', type:'multi', q:'Which of the following are ways an attacker might use <strong>prompt injection</strong> against an LLM? (Select all that apply)',
     opts:['Sidestepping (asking for hints or rhymes instead of the secret)','Adding more GPUs to the model\'s server','Mixing languages or emojis to confuse filters','Role-playing ("pretend you are a Linux terminal")'], correct:[0,2,3],
     exp:'Prompt injection manipulates the model <strong>through its input text</strong>: sidestepping, role-play, and mixing languages, encodings, or emojis to slip past filters. Adding GPUs only changes the server\'s computing power.'},
    {id:'a11', type:'matching', q:'Match each AI attack to its description.',
     pairs:[
       {L:'Poisoning', R:'Corrupting the training data so the model learns the wrong behavior'},
       {L:'Evasion', R:'Crafting an input that fools an already-trained model'},
       {L:'Model extraction', R:'Querying a model over and over to copy how it behaves'},
       {L:'Prompt injection', R:'Writing input text that overrides or bypasses the model\'s instructions'},
     ],
     distractors:['Adding more training data to make the model more accurate'],
     exp:'A useful way to remember them: poisoning happens <strong>before</strong> training; evasion and prompt injection happen <strong>at use</strong>; extraction <strong>steals</strong> the model.'},
    {id:'a12', src:'quiz', type:'short', q:'In your own words, explain the difference between a <strong>poisoning</strong> attack and an <strong>evasion</strong> attack. Give one example of each.',
     keywords:['train','data','input','after','before','fool','corrupt','spam','malware','image','sticker','sign'],
     modelAnswer:'Poisoning attacks the model during training by slipping bad data into the training set. For example, an attacker floods a spam filter\'s training data with spam labeled "not spam" so it learns to let spam through. Evasion attacks a model that is already trained by crafting a tricky input. For example, someone puts small stickers on a stop sign so a self-driving car\'s vision model reads it as a speed-limit sign.',
     exp:'The key difference is <strong>when</strong> the attack happens: poisoning corrupts <strong>training</strong>; evasion fools the model at <strong>prediction time</strong>.'},
    {id:'a13', src:'quiz', type:'short', q:'Attackers can now use AI to write convincing spear-phishing messages. Give two ways a person could protect themselves from a message like this.',
     keywords:['verify','call','separate','channel','link','mfa','sender','urgent','report','hover','official','password manager'],
     modelAnswer:'(1) Verify any unexpected request through a separate, trusted channel, for example by calling the person at a number you already know instead of replying to the message. (2) Don\'t click links in the message; go to the site directly by typing the address, and keep MFA turned on so a stolen password alone isn\'t enough. Being suspicious of urgency or secrecy also helps, since AI can make the grammar perfect but the request is still unusual.',
     exp:'Because AI removes the old warning signs (typos, awkward wording), defenses should focus on <strong>verifying the request</strong>, not on how polished the message looks.'},

    {id:'a14', type:'mc',
     q:'Grouping customers into segments based on similar behavior, <em>without</em> labeled examples, is an example of:',
     opts:[
       "Supervised learning (classification)",
       "Prompt injection",
       "Unsupervised learning (clustering)",
       "Model extraction"],
     correct:2,
     exp:'<strong>Supervised</strong> learning uses labeled data (classification, regression). <strong>Unsupervised</strong> learning finds structure on its own (clustering, dimensionality reduction, association).'},
    {id:'a15', type:'mc',
     q:'Which three advances combined to produce today\'s powerful large language models?',
     opts:[
       "Quantum computers, blockchains, and VR headsets",
       "Faster WiFi, bigger hard drives, and better keyboards",
       "Powerful GPUs, massive text datasets, and improved AI algorithms",
       "More programmers, longer code, and stricter laws"],
     correct:2,
     exp:'<strong>GPUs</strong> + <strong>massive text corpora</strong> + <strong>better algorithms</strong>. Since all three keep improving, LLMs are expected to keep improving too.'},
    {id:'a16', type:'multi',
     q:'Which of these are key properties of LLMs discussed in class? (Select all that apply)',
     opts:['They predict the next token','They are "black box" and non-deterministic','They tend to be overconfident and sycophantic (people pleasers)','They always cite accurate sources'],
     correct:[0,1,2],
     exp:'LLMs predict tokens, are hard-to-inspect neural networks that vary their output, and tend to sound confident and agreeable even when wrong, so their output must be checked.'},
    {id:'a17', type:'mc',
     q:'An attacker repeatedly queries a model to work out what was in its training data, such as private medical records. Which attack is this?',
     opts:[
       "Evasion, by crafting inputs that fool the model",
       "Poisoning, by tampering with the training data",
       "Inference, by working out what data it was trained on",
       "Prompt leaking, by revealing its hidden system prompt"],
     correct:2,
     exp:'<strong>Inference attacks</strong> extract information about the training data, which is a privacy risk whenever models are trained on sensitive data.'},
    {id:'a18', type:'mc',
     q:'An AI assistant is given permission to send emails, delete files, and make purchases on its own, and it does something harmful nobody intended. Which OWASP LLM risk is this?',
     opts:[
       "Insecure plugin design",
       "Model theft",
       "Training data poisoning",
       "Excessive agency"],
     correct:3,
     exp:'<strong>Excessive agency</strong> means giving an LLM system too much functionality, permission, or independence. Least privilege applies to AI too.'},
    {id:'a19', type:'mc',
     q:'An attacker sends a chatbot a series of harmless-seeming prompts that set up a scenario step by step, ending with the malicious request. Which prompt-injection technique is this?',
     opts:[
       "Poisoning",
       "Sidestepping",
       "Prompt leaking",
       "Virtualization"],
     correct:3,
     exp:'<strong>Virtualization</strong> "sets the scene" over several prompts. <strong>Sidestepping</strong> asks indirectly for the restricted thing (hints, rhymes, stories).'},
  ]
},

{
  id:'webdev', quiz:9, title:'HTML, CSS & JavaScript', color:'#be185d',
  desc:'Page structure, selectors, classes vs. IDs, comments, and why input must be handled safely',
  questions:[
    {id:'j1', src:'quiz', type:'matching', q:'Match each language with its role on a web page.',

       {L:'HTML', R:'Defines the structure of a page: what is in it'},
       {L:'CSS', R:'Controls how the page looks: colors, fonts, layout'},
       {L:'JavaScript', R:'Controls what things do: clicks, pop-ups, changes'},
     ],
     distractors:['Stores the page\'s data in a database on the server'],
     exp:'A common analogy: HTML is the <strong>skeleton</strong>, CSS is the <strong>skin and clothes</strong>, and JavaScript is the <strong>muscles</strong>.'},
    {id:'j2', src:'quiz', type:'mc', q:'Which HTML element holds all of the visible content of a web page?',
     opts:[
       "<code>&lt;link&gt;</code>",
       "<code>&lt;head&gt;</code>",
       "<code>&lt;title&gt;</code>",
       "<code>&lt;body&gt;</code>"],
     correct:3,
     exp:'Everything you see on the page goes inside <code>&lt;body&gt;</code>. The <code>&lt;head&gt;</code> holds information <em>about</em> the page (title, links to CSS, metadata).'},
    {id:'j3', src:'quiz', type:'mc', q:'Which element is used to link external files, such as a CSS file, to an HTML page?',
     opts:[
       "<code>&lt;p&gt;</code>",
       "<code>&lt;link&gt;</code>",
       "<code>&lt;span&gt;</code>",
       "<code>&lt;url&gt;</code>"],
     correct:1,
     exp:'For example: <code>&lt;link rel="stylesheet" href="style.css"&gt;</code>, placed in the <code>&lt;head&gt;</code>. (JavaScript files are usually loaded with <code>&lt;script src="…"&gt;</code>.)'},
    {id:'j4', src:'quiz', type:'tf', q:'An HTML <code>id</code> should be used for many elements on a page, while a <code>class</code> should be used for only one element.',
     correct:1,
     exp:'<strong>False. It\'s the other way around.</strong> An <code>id</code> must be <strong>unique</strong> (one element), while a <code>class</code> can be shared by <strong>many</strong> elements.'},
    {id:'j5', src:'quiz', type:'mc', q:'Which CSS selector affects every element that has the class "warning"?',
     opts:[
       "<code>.warning</code>",
       "<code>warning</code>",
       "<code>#warning</code>",
       "<code>&lt;warning&gt;</code>"],
     correct:0,
     exp:'A <strong>dot</strong> selects a class (<code>.warning</code>); a <strong>hash</strong> selects an id (<code>#warning</code>); a bare word selects an element type (<code>p</code>, <code>div</code>).'},
    {id:'j6', src:'quiz', type:'mc', q:'A page contains <code>&lt;div id="banner"&gt;</code> and several <code>&lt;div class="card"&gt;</code> elements. Which CSS rule changes the background color of <em>only</em> the banner to blue?',
     opts:[
       "<code>.banner { background-color: blue; }</code>",
       "<code>#banner { background-color: blue; }</code>",
       "<code>div { background-color: blue; }</code>",
       "<code>.card { background-color: blue; }</code>"],
     correct:1,
     exp:'The banner has an <strong>id</strong>, so you select it with <code>#banner</code>. <code>.banner</code> would look for a <em>class</em> named banner (which doesn\'t exist), and <code>div</code> would turn every div blue.'},
    {id:'j7', src:'quiz', type:'tf', q:'CSS can be written inside <code>&lt;style&gt;</code> tags in an HTML document, or placed in an external file such as <code>style.css</code>.',
     correct:0,
     exp:'<strong>True.</strong> CSS can be internal (<code>&lt;style&gt;</code>), external (a linked <code>.css</code> file), or inline (a <code>style="…"</code> attribute). External files are easiest to reuse across many pages.'},
    {id:'j8', src:'quiz', type:'mc', q:'Which CSS property changes the <strong>text</strong> color of an element?',
     opts:[
       "<code>width</code>",
       "<code>height</code>",
       "<code>color</code>",
       "<code>background-color</code>"],
     correct:2,
     exp:'<code>color</code> sets the text color; <code>background-color</code> sets the color behind it.'},
    {id:'j9', src:'quiz', type:'mc', q:'Which of the following is a valid single-line comment in JavaScript?',
     opts:[
       "<code>** This is a comment</code>",
       "<code># This is a comment</code>",
       "<code>&lt;!-- This is a comment --&gt;</code>",
       "<code>// This is a comment</code>"],
     correct:3,
     exp:'JavaScript uses <code>//</code> for single-line comments (and <code>/* … */</code> for multi-line). <code>&lt;!-- --&gt;</code> is an <strong>HTML</strong> comment; <code>#</code> is used in Python and shell scripts.'},
    {id:'j10', type:'mc', q:'Where does the <code>&lt;title&gt;</code> element go, and where does its text appear?',
     opts:[
       "In a JavaScript file; it shows a pop-up",
       "In the <code>&lt;body&gt;</code>; it appears as the biggest heading on the page",
       "In the CSS file; it sets the font",
       "In the <code>&lt;head&gt;</code>; it appears on the browser tab"],
     correct:3,
     exp:'<code>&lt;title&gt;</code> lives in the <code>&lt;head&gt;</code> and shows on the browser tab and in bookmarks. The big heading on the page is an <code>&lt;h1&gt;</code> in the body.'},
    {id:'j11', type:'mc', q:'A comment box takes whatever a visitor types and inserts it directly into the page\'s HTML for everyone to see. Why is this dangerous?',
     opts:[
       "Visitors could post so many comments that the page loads slowly",
       "Comments with special characters could crash a visitor's browser",
       "Search engines would index the comments and lower the site's ranking",
       "An attacker could post a <code>&lt;script&gt;</code> that runs in other visitors' browsers"],
     correct:3,
     exp:'This is <strong>cross-site scripting (XSS)</strong>. Because browsers run any JavaScript in a page, user input must be treated as <em>text</em>, not code. That is why developers escape or sanitize input before displaying it.'},
  ]
},

{
  id:'malware', quiz:10, title:'Malware & Staying Safe Online', color:'#0f766e',
  desc:'Infection vectors, software security controls, DNS, typosquatting, lookalike links',
  questions:[
    {id:'m1', src:'quiz', type:'mc', q:'Which device type makes up about 75% of devices infected with malware?',
     opts:[
       "Smartphones",
       "Laptops",
       "Routers",
       "Smart TVs"],
     correct:2,
     exp:'As covered in class, <strong>routers</strong> account for most infected devices. They are always on and connected to the Internet, often still use default passwords, and are rarely updated, which makes them easy, long-lasting targets.'},
    {id:'m2', src:'quiz', type:'multi', q:'Which of these are common malware <strong>infection vectors</strong>? (Select all that apply)',
     opts:['Phishing emails','Drive-by downloads from compromised websites','Infected USB drives','Keeping software up to date','Pirated software and keygens'], correct:[0,1,2,4],
     exp:'Phishing, drive-by downloads, infected USBs, and pirated software are all common ways malware gets in. Keeping software <strong>up to date</strong> is a defense, not a vector.'},
    {id:'m3', src:'quiz', type:'tf', q:'Disabling macros by default is a recommended way to reduce the risk of malicious Office attachments.',
     correct:0,

     exp:'Backups, MFA, trusted download sources, and antivirus are all good controls. Clicking links in unexpected emails "to check" is exactly what phishers want. Verify through a separate channel instead.'},
    {id:'m5', src:'quiz', type:'tf', q:'The Internet and the World Wide Web are the same thing.',
     correct:1,
     exp:'<strong>False.</strong> The Internet is the global network infrastructure; the Web is one service (linked pages over HTTP) that runs on it.'},
    {id:'m6', src:'quiz', type:'matching', q:'Match each term to its description.',
     pairs:[
       {L:'HTTP', R:'Protocol used to request and send web documents'},
       {L:'Web browser', R:'Client software that retrieves pages and displays them'},

     distractors:['Translates domain names into IP addresses'],

    {id:'m7', src:'quiz', type:'mc', q:'Which of these links is most likely to actually take you to Google\'s real website?',

    {id:'m8', src:'quiz', type:'mc', q:'When you type a URL into your browser, what happens <strong>first</strong>?',
     opts:[

    {id:'m9', src:'quiz', type:'mc', q:'A "typosquat" attack relies on:',
     opts:[
       "Encrypting your files until you pay",
       "Tampering with a software update upstream",
       "Guessing your password by brute force",
       "Registering a domain that looks like a real one with a small spelling change"],
     correct:3,
     exp:'<strong>Typosquatting</strong> catches people who mistype a URL, or who don\'t notice a small difference (<code>paypa1.com</code>, <code>amazn.com</code>). The other options describe ransomware, brute force, and a supply-chain attack.'},
    {id:'m10', type:'matching', q:'Match each threat to its description.',

       {L:'Ransomware', R:'Encrypts your files and demands payment for the key'},
       {L:'Typosquatting', R:'Registers lookalike domains that differ from real ones by a small spelling change'},
       {L:'Supply-chain attack', R:'Tampers with trusted software or updates before they reach users'},
       {L:'Drive-by download', R:'Malware delivered just by visiting a compromised website'},

     distractors:['Fixes a known vulnerability before attackers can use it'],

    {id:'m11', type:'mc', q:'Why are home routers such common malware targets?',

       "They're always on, often keep default passwords, and are rarely updated",

    {id:'m12', type:'short', q:'A friend texts you a link: <code>https://paypa1-secure.com/verify-account</code>, saying your PayPal account will be locked in an hour. Identify two red flags, and explain what you should do instead.',
     keywords:['domain','1','spell','typo','urgen','lock','hour','pressure','official','app','type','directly','verify','report'],
     modelAnswer:'Red flags: (1) the domain is "paypa1-secure.com" with the number 1 in place of the letter l, which makes it a lookalike/typosquat domain that PayPal doesn\'t own; (2) the message creates urgency ("locked in an hour") to pressure you into acting without thinking. Instead, don\'t click the link. Open the PayPal app or type paypal.com yourself to check your account, and let your friend know their account may be compromised.',
     exp:'Look at the <strong>real domain</strong>, watch for <strong>urgency and pressure</strong>, and always <strong>navigate to the site yourself</strong> instead of following the link.'},

    {id:'m13', type:'mc',

    {id:'m15', type:'mc',

    {id:'m16', type:'mc',

/* ───────────────────── SECURITY CONTROLS (Nov 20) ───────────────────── */
{
  id:'controls', label:'Nov 20', title:'Security Controls', color:'#334155',
  desc:'Risk terms, control classifications, defense in depth, baselines, NIST and CIS',
  questions:[
    {id:'s1', type:'mc',
     q:'What is a <strong>security control</strong>?',
     opts:[
       "A person whose job is to monitor security cameras and alarms",
       "A law or regulation that requires organizations to protect data",
       "A safeguard that protects the confidentiality, integrity, and availability of a system",
       "A weakness in a system that an attacker could take advantage of"],
     correct:2,
     exp:'This is NIST\'s definition. Think of a castle: moats, walls, guards, and the keep are all controls.'},
    {id:'s2', type:'matching',
     q:'Match each term to its definition.',
     pairs:[
       {L:'Vulnerability', R:'A weakness that exposes an organization to threats'},
       {L:'Exploit', R:'A technique or tool that takes advantage of a vulnerability'},
       {L:'Threat', R:'A source or circumstance that could cause harm, like a hurricane or a cybercriminal'},
       {L:'Risk', R:'The potential for loss, considering both likelihood and impact'},
     ],
     distractors:['A safeguard that protects an asset'],
     exp:'Example: a new router\'s <strong>default password</strong> is a vulnerability; a criminal scanning for that router model is a threat; logging in with the default credentials is the exploit; what you could lose is the risk. (The extra choice describes a security control.)'},
    {id:'s3', type:'mc',
     q:'Security controls reduce risk by lowering one of its three parts. Regular, tested <strong>backups</strong> mainly reduce which part?',
     opts:[
       "The consequence (impact)",
       "The vulnerability",
       "The threat",
       "None of them"],
     correct:0,
     exp:'Backups don\'t stop ransomware from arriving, but they shrink the <strong>impact</strong>, since you can restore instead of paying. Patching reduces <em>vulnerability</em>; deterrents reduce the likelihood a <em>threat</em> acts.'},
    {id:'s4', type:'matching',
     q:'Match each control <strong>classification</strong> to its purpose.',
     pairs:[
       {L:'Deterrent', R:'Discourages a threat actor from acting'},
       {L:'Preventative', R:'Stops a threat actor from being successful'},
       {L:'Detective', R:'Identifies and reports a threat actor or action'},
       {L:'Corrective', R:'Minimizes the impact or fixes the situation'},
     ],
     exp:'Remember: <strong>discourage → stop → notice → fix</strong>. A single control can fall into more than one classification.'},
    {id:'s5', type:'mc',
     q:'Every morning, a security analyst reviews the previous day\'s login records and flags any account that had dozens of failed password attempts overnight. How is this control classified?',
     opts:[
       "Deterrent",
       "Preventative",
       "Detective",
       "Corrective"],
     correct:2,
     exp:'Reviewing logs doesn\'t stop or discourage anything; it <strong>notices and reports</strong> suspicious activity, which makes it <strong>detective</strong>. Intrusion Detection Systems, SIEM log monitoring, and file-integrity monitoring are other detective controls.'},
    {id:'s6', type:'mc',
     q:'After a ransomware attack, IT restores all files from last night\'s backup. Restoring backups is what type of control?',
     opts:[
       "Deterrent",
       "Corrective",
       "Detective",
       "Preventative"],
     correct:1,
     exp:'Restoring backups <strong>fixes the situation and minimizes impact</strong>. Patch management, antivirus quarantine, and account resets are also corrective.'},
    {id:'s8', type:'tf',
     q:'A single security control can fall into more than one classification.',
     correct:0,
     exp:'<strong>True.</strong> For example, a visible security camera <em>deters</em> and also <em>detects</em>; antivirus can <em>prevent</em>, <em>detect</em>, and <em>correct</em> (quarantine).'},
    {id:'s9', type:'mc',
     q:'What is <strong>defense in depth</strong> (layered security)?',
     opts:[
       "Multiple overlapping layers of different controls, so one failure isn't fatal",
       "Encrypting data twice so one broken key doesn't expose it",
       "Storing backups in a secure location far from the main office",
       "Using one very strong control that no attacker can get past"],
     correct:0,
     exp:'Like a castle with a moat, walls, and a keep: if attackers breach one layer, <strong>others remain</strong>.'},
    {id:'s10', type:'mc',
     q:'In security, what is a <strong>baseline</strong>?',
     opts:[
       "The highest level of security an organization can achieve",
       "A list of the known threat actors targeting an organization",
       "The first set of controls a new company buys from a vendor",
       "A minimum standard of controls for a given environment"],
     correct:3,
     exp:'A baseline sets the bar every system must clear. Some are defined by law or industry; for example, HIPAA defines a baseline for medical data.'},
    {id:'s11', type:'mc',
     q:'Why should security control frameworks be <strong>scoped and tailored</strong> to each organization?',
     opts:[
       "So organizations can leave out any control that is too expensive or inconvenient to implement",
       "So every organization ends up with the same standard set of controls, which makes audits consistent",
       "Because smaller organizations face fewer threats and can skip the baseline controls entirely",
       "So the controls are proportionate to the criticality and sensitivity of the assets being protected"],
     correct:3,
     exp:'Tailoring is driven by <strong>risk</strong>: how critical and sensitive the assets are. It is not a way to skip controls just because they\'re costly or inconvenient, and it doesn\'t let anyone drop below the required <strong>baseline</strong>. A small bakery and a hospital shouldn\'t implement identical controls, because <strong>one size does not fit all</strong>.'},
    {id:'s12', type:'mc',
     q:'What is <strong>NIST 800-53</strong>?',
     opts:[
       "A yearly ranking of the ten most critical web application security risks",
       "A federal law requiring U.S. companies to report data breaches within 72 hours",
       "A catalog of security and privacy controls from the National Institute of Standards and Technology",
       "A prioritized list of safeguards organized into Implementation Groups IG1, IG2, and IG3"],
     correct:2,
     exp:'NIST 800-53 is a comprehensive <strong>control catalog</strong> used by government and industry, with control families such as Supply Chain Risk Management and PII Processing and Transparency. The other choices describe different things: the <strong>OWASP Top 10</strong>, a breach-notification law, and the <strong>CIS Controls</strong>.'},
    {id:'s13', type:'mc',
     q:'The CIS Controls are organized into Implementation Groups (IG1, IG2, IG3). Where should an organization start?',
     opts:[
       "IG3, the most advanced",
       "IG1, the baseline set, then IG2 and IG3",
       "Any group at random",
       "Only IG2"],
     correct:1,
     exp:'<strong>IG1</strong> is the essential baseline that every organization should implement first; IG2 and IG3 add protections for larger or higher-risk organizations.'},
    {id:'s14', type:'mc',
     q:'Management requires every employee to complete phishing training each year. Under the CompTIA Security+ categories, this <em>requirement</em> is best described as a:',
     opts:[
       "Physical control",
       "Managerial control",
       "Technical control",
       "Detective control"],
     correct:1,
     exp:'Requirements set by management are <strong>managerial</strong>; employees actually completing the training is <strong>operational</strong>. (Some frameworks combine both as "administrative.")'},
    {id:'s15', type:'short',
     q:'Pick one important asset of your own (for example, your laptop or your bank account). Name one <strong>preventative</strong>, one <strong>detective</strong>, and one <strong>corrective</strong> control you could use to protect it.',
     keywords:['mfa','password','encrypt','firewall','antivirus','backup','alert','notification','log','restore','lock','update','patch','monitor'],
     modelAnswer:'Asset: my bank account. Preventative: a strong unique password plus multi-factor authentication. Detective: text alerts for every login and every transaction over $1. Corrective: a plan to call the bank immediately to freeze the account and reverse fraudulent charges, plus resetting my password.',
     exp:'A good answer gives one control that <strong>stops</strong> attacks, one that <strong>notices</strong> them, and one that <strong>recovers</strong> from them, a small example of defense in depth.'},

    {id:'s16', type:'matching',
     q:'Match each control <strong>classification</strong> to an example of it.',
     pairs:[
       {L:'Deterrent', R:'A login banner warning that unauthorized use will be prosecuted'},
       {L:'Preventative', R:'A locked door on the server room'},
       {L:'Detective', R:'An alert that fires when critical system files change unexpectedly'},
       {L:'Corrective', R:'Reimaging an infected laptop back to a clean state'},
     ],
     exp:'<strong>Deterrent</strong> discourages, <strong>preventative</strong> stops, <strong>detective</strong> notices and reports, and <strong>corrective</strong> fixes or limits the damage.'},
    {id:'s17', type:'matching',
     q:'Match each term to an <strong>example</strong> of it.',
     pairs:[
       {L:'Vulnerability', R:'A laptop that is missing last month\'s security patch'},
       {L:'Threat actor', R:'A hacktivist group angry about a company\'s policies'},
       {L:'Exploit', R:'Code that uses a known software flaw to take control of a server'},
       {L:'Risk', R:'The chance that a breach costs the company customers and money'},
     ],
     distractors:['A firewall that blocks unknown incoming connections'],
     exp:'The extra choice is a <strong>security control</strong>. Remember: a vulnerability is a weakness, a threat actor is who might attack, an exploit is how they take advantage, and risk is the potential loss.'},
  ]
},
];

</script>
<script>
{
const LETTERS='ABCDEFGHIJ';
const TYPE={mc:'Multiple choice',tf:'True / false',multi:'Select all that apply',matching:'Matching',short:'Short answer'};
MODULES.forEach(m=>m.questions.forEach(q=>{ if(q.type==='tf') q.opts=['True','False']; }));
const $=id=>document.getElementById(id);
const strip=h=>h.replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const KEY='cyber110-practice-v1';
let S={m:0,i:0,cur:null,results:{},drafts:{}};
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){S.results=saved.results||{};S.drafts=saved.drafts||{};}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({results:S.results,drafts:S.drafts}))}catch(e){}}

const mod=()=>MODULES[S.m];
const qAt=i=>mod().questions[i];
const curQ=()=>qAt(S.i);
const chipOf=m=>m.quiz?'Quiz '+m.quiz:m.label+' slides';
const srcLabel=(q,m)=>q.src==='quiz'?'From Quiz '+m.quiz:q.src?'From '+q.src:'';

const graded=q=>{const r=S.results[q.id];return !!r&&typeof r.correct==='boolean';};
function modScore(m){let c=0,a=0;m.questions.forEach(q=>{if(graded(q)){a++;if(S.results[q.id].correct)c++;}});return{c,a,n:m.questions.length};}
function total(){let c=0,a=0,n=0;MODULES.forEach(m=>{const s=modScore(m);c+=s.c;a+=s.a;n+=s.n;});return{c,a,n};}
const started=m=>m.questions.some(q=>S.results[q.id]||S.drafts[q.id]!==undefined);
const complete=m=>m.questions.every(graded);

function refreshTop(){
  const T=total();
  $('gbar').style.width=(T.n?T.a/T.n*100:0)+'%';
  $('hScore').textContent=T.a?T.c+' / '+T.a:'—';
  $('hDone').textContent=T.a+' of '+T.n;
}
function show(id){['home','quiz','summary','final'].forEach(s=>$(s).hidden=s!==id);window.scrollTo(0,0);}

function home(){
  refreshTop();
  $('grid').innerHTML=MODULES.map((m,k)=>{
    const s=modScore(m),pct=s.a/s.n*100;
    return `<button class="card" style="--mc:${m.color}" data-k="${k}" aria-label="Open ${chipOf(m)}: ${esc(m.title)}">
      <div class="top"><span class="chip">${chipOf(m)}</span>${complete(m)?'<span class="done-mark">✓ Done</span>':''}</div>
      <h3>${m.title}</h3><p>${m.desc}</p>
      <div class="mini"><div class="t"><i style="width:${pct}%"></i></div><span>${!s.a?s.n+' questions':s.a===s.n?s.c+'/'+s.n+' correct':s.c+' of '+s.a+' correct · '+(s.n-s.a)+' left'}</span></div>
    </button>`;}).join('');
  show('home');
}
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openModule(+c.dataset.k);});

function firstOpen(from){for(let i=from;i<mod().questions.length;i++)if(!graded(qAt(i)))return i;return -1;}
function openModule(k){
  S.m=k;
  if(!started(mod())){S.i=0;render();show('quiz');return;}
  const n=firstOpen(0);
  if(n===-1){summary();return;}
  S.i=n;render();show('quiz');
}
function retake(k){MODULES[k].questions.forEach(q=>{delete S.results[q.id];delete S.drafts[q.id];});persist();S.m=k;S.i=0;render();show('quiz');}

function render(){
  const m=mod(),q=curQ(),r=S.results[q.id];
  S.cur=null;
  document.documentElement.style.setProperty('--mc',m.color);
  $('mstrip').style.setProperty('--mc',m.color);
  $('mtitle').textContent=chipOf(m)+' · '+m.title;
  $('mdesc').textContent=m.desc;
  $('count').textContent='Question '+(S.i+1)+' of '+m.questions.length;
  const s=modScore(m);$('mscore').textContent=s.a?s.c+' of '+s.a+' correct':'Not started';
  $('dots').innerHTML=m.questions.map((qq,i)=>{const rr=S.results[qq.id];const st=!rr?'':rr.correct===null?'sa':rr.correct?'ok':'no';
    return `<button class="dot ${st} ${i===S.i?'cur':''}" data-i="${i}" title="Question ${i+1}${rr?' (answered)':''}" aria-label="Go to question ${i+1}"${i===S.i?' aria-current="step"':''}></button>`;}).join('');
  const sl=srcLabel(q,m);
  $('qcard').innerHTML=`<div class="qmeta"><span class="tag">${TYPE[q.type]}</span>${sl?`<span class="tag src">${sl}</span>`:''}<span class="qid">ID ${q.id}</span></div>
    <div class="qtext">${q.q}</div><div id="input"></div>`;
  const box=$('input');
  if(q.type==='matching')renderMatch(q,box,r);
  else if(q.type==='short')renderShort(q,box,r);
  else renderOpts(q,box,r);
  if(!r)restoreDraft(q);
  $('fb').hidden=true;
  if(r)feedback(q);
  $('check').hidden=!!r;
  navButtons();
}
$('dots').addEventListener('click',e=>{const d=e.target.closest('.dot');if(d)go(+d.dataset.i);});

function renderOpts(q,box,r){
  const multi=q.type==='multi';
  if(multi)box.insertAdjacentHTML('beforeend','<p class="hint">Select every correct answer. You need all of them, and none of the wrong ones, to get credit.</p>');
  const wrap=document.createElement('div');wrap.className='opts';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');b.type='button';b.className='opt'+(multi?' multi':'');
    let note='';
    if(r){b.disabled=true;
      const isC=multi?q.correct.includes(i):i===q.correct;
      const chosen=multi?r.chosen.includes(i):r.chosen===i;
      if(isC&&chosen)b.classList.add('right');
      else if(isC&&!chosen){b.classList.add(multi?'missed':'right');if(multi)note='<span class="why">Correct answer you didn\'t select</span>';}
      else if(chosen)b.classList.add('wrong');
    }
    b.innerHTML=`<span class="k">${LETTERS[i]}</span><span>${o}${note}</span>`;
    if(!r)b.onclick=()=>{
      if(multi){S.cur=S.cur||[];const at=S.cur.indexOf(i);if(at>-1)S.cur.splice(at,1);else S.cur.push(i);b.classList.toggle('sel');}
      else{wrap.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.cur=i;}
    };
    wrap.appendChild(b);
  });
  box.appendChild(wrap);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const shuffled={};
function renderMatch(q,box,r){
  if(q.distractors&&q.distractors.length)box.insertAdjacentHTML('beforeend',`<p class="hint">${q.distractors.length===1?'One answer choice is extra and won\'t be used.':q.distractors.length+' answer choices are extra and won\'t be used.'}</p>`);
  if(!shuffled[q.id])shuffled[q.id]=shuffle(q.pairs.map(p=>p.R).concat(q.distractors||[]));
  const choices=shuffled[q.id];
  const isCode=q.pairs.every(p=>!/\s/.test(p.L)&&/[.:\/?#=]|^\d+$|^https$/.test(p.L));
  q.pairs.forEach((p,i)=>{
    const row=document.createElement('div');row.className='mrow';
    row.innerHTML=`<div class="mleft${isCode?' code':''}"></div><div class="marrow">→</div>`;
    row.firstChild.textContent=p.L;
    const sel=document.createElement('select');sel.id='ms'+i;sel.setAttribute('aria-label','Match for '+p.L);
    sel.innerHTML='<option value="" disabled selected>Choose a match</option>';
    choices.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
    row.appendChild(sel);
    if(r){sel.disabled=true;const ch=r.chosen[i];if(ch){sel.value=ch;sel.classList.add(ch===p.R?'right':'wrong');}
      if(ch!==p.R){const f=document.createElement('div');f.className='fix';f.textContent='✓ '+p.R;row.appendChild(f);}}
    else sel.onchange=()=>{S.cur=S.cur||{};S.cur[i]=sel.value;};
    box.appendChild(row);
  });
}
function renderShort(q,box,r){
  const ta=document.createElement('textarea');ta.placeholder='Type your answer here…';ta.setAttribute('aria-label','Your answer');
  if(r){ta.value=r.text||'';ta.disabled=true;}else ta.oninput=()=>{S.cur=ta.value;};
  box.appendChild(ta);
  box.insertAdjacentHTML('beforeend','<p class="hint">Write 2–3 sentences, then compare with the model answer.</p>');
}

function check(){
  const q=curQ();let res;
  if(q.type==='mc'||q.type==='tf'){
    if(S.cur===null){toast('Choose an answer first.');return;}
    res={correct:S.cur===q.correct,chosen:S.cur};
  }else if(q.type==='multi'){
    if(!S.cur||!S.cur.length){toast('Select at least one answer.');return;}
    const a=[...S.cur].sort((x,y)=>x-y),b=[...q.correct].sort((x,y)=>x-y);
    res={correct:a.length===b.length&&a.every((v,i)=>v===b[i]),chosen:a};
  }else if(q.type==='matching'){
    const ch={};for(let i=0;i<q.pairs.length;i++){const v=$('ms'+i).value;if(!v){toast('Match every item first.');return;}ch[i]=v;}
    res={correct:q.pairs.every((p,i)=>ch[i]===p.R),chosen:ch};
  }else{
    const t=(S.cur||'').trim();if(t.length<10){toast('Write a little more before checking.');return;}
    res={correct:null,text:t};
  }
  S.results[q.id]=res;delete S.drafts[q.id];persist();
  render();refreshTop();
  $('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function feedback(q){
  const r=S.results[q.id],fb=$('fb');let cls,head,body=`<div class="ex">${q.exp}</div>`;
  if(q.type==='short'){
    const mine=r.correct===null?`<div class="grade"><p><strong>Compare your answer with the model answer.</strong> Did you get the main idea?</p><div class="actions"><button class="btn btn-p" id="gYes">Yes, count it correct</button><button class="btn btn-s" id="gNo">Not yet, count it wrong</button></div></div>`
      :`<p class="selfnote">You marked this ${r.correct?'correct':'wrong'}. <button class="linkbtn" id="gUndo">Change</button></p>`;
    cls=r.correct===null?'sa':r.correct?'ok':'no';head=r.correct===null?'Check your answer':r.correct?'✓ Correct (self-graded)':'✗ Not quite (self-graded)';
    body=`<div class="model" style="border:0;margin:0;padding:0 0 12px"><small>Model answer</small><div>${q.modelAnswer}</div></div><div class="ex" style="border-top:1px solid var(--line);padding-top:12px">${q.exp}</div>${mine}`;}
  else if(r.correct){cls='ok';head='✓ Correct';}
  else{cls='no';head='✗ Not quite';}
  fb.className='fb '+cls;fb.innerHTML=`<h4>${head}</h4>${body}`;fb.hidden=false;
  const g=(id,v)=>{const b=$(id);if(b)b.onclick=()=>{S.results[q.id].correct=v;persist();render();refreshTop();};};
  g('gYes',true);g('gNo',false);g('gUndo',null);
}

function saveDraft(){
  const q=curQ();if(!q||S.results[q.id])return;const a=S.cur;
  const empty=a===null||a===undefined||a===''||(typeof a==='object'&&Object.keys(a).length===0);
  if(empty)delete S.drafts[q.id];else S.drafts[q.id]=Array.isArray(a)?[...a]:typeof a==='object'?{...a}:a;
  persist();
}
function restoreDraft(q){
  const d=S.drafts[q.id];if(d===undefined)return;
  const btns=document.querySelectorAll('#input .opt');
  if(q.type==='mc'||q.type==='tf'){if(btns[d]){btns[d].classList.add('sel');S.cur=d;}}
  else if(q.type==='multi'){S.cur=[];d.forEach(i=>{if(btns[i]){btns[i].classList.add('sel');S.cur.push(i);}});}
  else if(q.type==='matching'){S.cur={};Object.keys(d).forEach(i=>{const s=$('ms'+i);if(s){s.value=d[i];if(s.value)S.cur[i]=d[i];}});}
  else{const ta=document.querySelector('#input textarea');if(ta){ta.value=d;S.cur=d;}}
}
function go(i){if(i<0||i>=mod().questions.length||i===S.i)return;saveDraft();S.i=i;render();window.scrollTo(0,0);}
function navButtons(){
  const last=mod().questions.length-1,ans=graded(curQ());
  $('skip').hidden=false;
  const pend=!!S.results[curQ().id]&&!ans;
  $('prev').hidden=S.i===0;$('next').hidden=!ans;$('skip').hidden=ans||pend;
  if(ans)$('next').textContent=S.i<last?'Next question →':firstOpen(0)!==-1?'Go to skipped question →':'See results →';
  else $('skip').textContent=firstOpen(S.i+1)!==-1?'Skip →':'Skip to results →';
}
$('check').onclick=check;
$('prev').onclick=()=>go(S.i-1);
$('next').onclick=()=>{if(S.i<mod().questions.length-1)go(S.i+1);else{const s=firstOpen(0);if(s!==-1)go(s);else summary();}};
$('skip').onclick=()=>{const n=firstOpen(S.i+1);if(n!==-1)go(n);else{saveDraft();summary();}};
$('toHome').onclick=()=>{saveDraft();home();};

function summary(){
  const m=mod(),s=modScore(m),skipped=m.questions.filter(q=>!graded(q)).length;
  const pct=s.a?Math.round(s.c/s.a*100):null;
  const msg=skipped?`${skipped} question${skipped>1?'s':''} still need${skipped>1?'':'s'} an answer (or a self-grade, for short answers). Finish ${skipped>1?'them':'it'} to complete this quiz.`
    :pct===100?'Perfect score.':pct>=80?'Strong work. Review anything you missed below.':pct>=60?'Good progress. Read the explanations for the ones you missed.':'Keep at it. Go through the explanations, then retake this quiz.';
  const rev=m.questions.map(q=>{const r=S.results[q.id];let c,ic,note;
    if(!r){c='';ic='–';note='Skipped';}
    else if(r.correct===null){c='sa';ic='✎';note='Not yet self-graded';}
    else if(r.correct){c='ok';ic='✓';note=q.type==='short'?'Correct (self-graded)':'Correct';}
    else if(q.type==='short'){c='no';ic='✗';note='Missed (self-graded) — see model answer';}
    else{c='no';ic='✗';note='Incorrect — '+(q.type==='mc'||q.type==='tf'?strip(q.opts[q.correct]):q.type==='multi'?'answer: '+q.correct.map(i=>LETTERS[i]).join(', '):'see explanation');}
    const t=strip(q.q);
    return `<div class="ri ${c}"><span class="ic">${ic}</span><div><b>${esc(note)} · ${q.id}</b>${esc(t.length>110?t.slice(0,110)+'…':t)}</div></div>`;}).join('');
  const nextMod=S.m<MODULES.length-1&&!MODULES.every(complete)
    ?`<button class="btn btn-p" id="sNext">Next: ${chipOf(MODULES[S.m+1])} →</button>`:`<button class="btn btn-p" id="sFinal">See overall results →</button>`;
  $('summary').innerHTML=`<div class="nav"><button class="btn btn-s btn-sm" id="sHome">← All quizzes</button></div>
    <div class="sum"><span class="chip" style="--mc:${m.color};background:${m.color}">${chipOf(m)}</span><h2 style="margin-top:10px">${m.title}</h2>
    ${s.a?`<div class="big">${s.c}<span> / ${s.a}</span></div>`:''}<p>${msg}</p></div>
    <div class="rev">${rev}</div>
    <div class="actions">${skipped?'<button class="btn btn-p" id="sSkip">Finish remaining questions →</button>':nextMod}
      <button class="btn btn-s" id="sReview">Review questions</button>
      <button class="btn btn-s" id="sRetake">Erase answers and retake</button></div>`;
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f;};
  on('sHome',home);on('sFinal',final);on('sNext',()=>openModule(S.m+1));
  on('sSkip',()=>{S.i=firstOpen(0);render();show('quiz');});
  on('sReview',()=>{S.i=0;render();show('quiz');});
  on('sRetake',()=>retake(S.m));
  show('summary');refreshTop();
}
function final(){
  const T=total(),pct=T.a?Math.round(T.c/T.a*100):0;
  const brk=MODULES.map(m=>{const s=modScore(m),p=s.a?s.c/s.a*100:0;
    return `<div class="br"><span class="chip" style="background:${m.color}">${chipOf(m)}</span><span>${m.title}</span><div class="t"><i style="width:${s.a?p:0}%"></i></div><span class="n">${s.a?s.c+'/'+s.a:'—'}</span></div>`;}).join('');
  $('final').innerHTML=`<div class="sum"><h2>Overall results</h2><div class="big">${T.c}<span> / ${T.a}</span></div><p>${T.a} of ${T.n} questions answered</p>
    <p>${pct>=90?'Excellent — you\'re ready for the final.':pct>=75?'Solid. Revisit the quizzes with the lowest scores below.':'Use the breakdown below to decide which quizzes to review first.'}</p></div>
    <div class="brk">${brk}</div>
    <div class="actions" style="justify-content:center"><button class="btn btn-s" id="fHome">← All quizzes</button><button class="btn btn-s" id="fReset">Erase everything and start over</button></div>`;
  $('fHome').onclick=home;
  $('fReset').onclick=()=>{const b=$('fReset');if(b.dataset.armed){S.results={};S.drafts={};persist();home();}else{b.dataset.armed=1;b.textContent='Click again to erase all answers';}};
  show('final');
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2200);}
home();
}
</script>
</body>
